name: Lighthouse CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "public/**"
      - "next.config.ts"
      - "package.json"
      - "scripts/lighthouse-*.js"
      - ".github/workflows/lighthouse.yml"

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: swapbuds_test
          POSTGRES_PASSWORD: swapbuds_test_password
          POSTGRES_DB: swapbuds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/swapbuds-backend
          path: backend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Puppeteer Chromium
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/puppeteer
            frontend/node_modules/.cache
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-puppeteer-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: |
            frontend/yarn.lock
            backend/yarn.lock

      - name: Install dependencies
        run: |
          # Install in parallel to save time
          cd backend && yarn install --frozen-lockfile --prefer-offline &
          BACKEND_PID=$!
          cd ../frontend && yarn install --frozen-lockfile --prefer-offline &
          FRONTEND_PID=$!

          # Wait for both to complete
          wait $BACKEND_PID
          wait $FRONTEND_PID
          echo "✅ Dependencies installed"

      - name: Setup and start backend
        working-directory: backend
        run: |
          yarn prisma generate
          yarn prisma migrate deploy
          yarn prisma db seed
          yarn build
          yarn start:prod &
          echo $! > backend.pid

          # Wait for backend to respond
          for i in {1..30}; do
            if curl -s http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "✅ Backend ready"
              break
            fi
            echo "⏳ Waiting for backend ($i/30)..."
            sleep 2
          done
        env:
          DATABASE_URL: postgresql://swapbuds_test:swapbuds_test_password@localhost:5432/swapbuds_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: lighthouse-test-jwt-secret
          JWT_EXPIRES_IN: 7d
          PORT: 3001
          NODE_ENV: production
          CORS_ORIGIN: http://localhost:3000
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          AWS_S3_BUCKET: test

      - name: Build and start frontend
        working-directory: frontend
        run: |
          yarn build
          yarn start &
          echo $! > frontend.pid

          # Wait for frontend
          for i in {1..30}; do
            if curl -f http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Frontend ready"
              break
            fi
            echo "⏳ Waiting for frontend ($i/30)..."
            sleep 2
          done
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_SKIP_RECAPTCHA: "true"
          NODE_ENV: production

      - name: Verify Lighthouse dependencies
        working-directory: frontend
        run: |
          # Check if puppeteer is already installed (should be from package.json)
          if ! node -e "require('puppeteer')" 2>/dev/null; then
            echo "⚠️ Installing missing Lighthouse dependencies..."
            yarn add -D puppeteer lighthouse chrome-launcher
          else
            echo "✅ Lighthouse dependencies already installed"
          fi

      - name: Verify backend API is responding
        working-directory: frontend
        run: |
          echo "🔍 Verifying backend API endpoints..."
          for i in {1..15}; do
            if curl -s http://localhost:3001/api/auth/login > /dev/null 2>&1; then
              echo "✅ Backend API endpoints ready"
              sleep 2
              break
            fi
            echo "⏳ Waiting for backend API to be ready ($i/15)..."
            sleep 3
          done

          # Final check
          if ! curl -f http://localhost:3001/api/health > /dev/null 2>&1; then
            echo "❌ Backend health check failed"
            exit 1
          fi
          echo "✅ Backend verified and ready"

      - name: Authenticate test users
        working-directory: frontend
        run: |
          npx tsx scripts/lighthouse-auth.ts user
          npx tsx scripts/lighthouse-auth.ts admin

      - name: Run Lighthouse audits
        working-directory: frontend
        run: node scripts/lighthouse-runner.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: "frontend/.lighthouseci"
          retention-days: 30

      - name: Cleanup servers
        if: always()
        run: |
          [ -f backend/backend.pid ] && kill $(cat backend/backend.pid) 2>/dev/null || true
          [ -f frontend/frontend.pid ] && kill $(cat frontend/frontend.pid) 2>/dev/null || true
