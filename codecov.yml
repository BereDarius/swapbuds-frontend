# Codecov Configuration
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    # Project-wide coverage check
    project:
      default:
        target: 85% # Match Vitest threshold
        threshold: 1% # Allow 1% decrease
        informational: false # Make it a required check
    # Per-file coverage check
    patch:
      default:
        target: 85% # Match Vitest threshold - new code must maintain 85% coverage
        threshold: 2%
        informational: false

  # Coverage range for visualization
  range: 60..100

# PR Comment Configuration
comment:
  layout: "reach, diff, flags, files"
  behavior: default # Update existing comment
  require_changes: false # Always comment
  require_base: false
  require_head: true

# Flags for different test types
flags:
  frontend-unit:
    paths:
      - src/
    carryforward: false

# Ignore paths
ignore:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "e2e/"
  - "coverage/"
  - ".next/"
  - "node_modules/"
  - "stories/"
  - "**/*.stories.ts"
  - "**/*.stories.tsx"
